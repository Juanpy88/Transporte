<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rutas Antofagasta</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="map"></div>
<button id="recenter" title="Centrar en mi ubicación" hidden>⌖</button>

<aside id="panel">
  <div id="viewPlan">
    <header>
      <h1>Planificar ruta</h1>
      <div><button id="newRoute">Nueva</button> <button id="openSaved">Guardadas</button></div>
    </header>
    <p id="editing" class="sub">Ruta nueva (sin guardar)</p>

    <div id="points"></div>
    <p id="hint" class="hint" hidden>Toca el mapa para fijar este punto.</p>

    <div class="opts">
      <label>Hora de salida <input id="depart" type="time" value="08:00"></label>
      <label>Min. por parada <input id="service" type="number" min="0" value="5"></label>
    </div>
    <label class="check"><input id="optimize" type="checkbox" checked> Optimizar el orden de las paradas</label>
    <button id="calc" class="cta">Calcular ruta</button>
    <p id="msg" class="hint"></p>

    <div id="result" hidden>
      <div id="summary" class="sub"></div>
      <ul id="eta"></ul>
      <div class="save">
        <button id="sim">Simular recorrido</button>
        <select id="speed"><option value="30">x30</option><option value="60" selected>x60</option><option value="180">x180</option></select>
      </div>
      <p id="simInfo" class="hint"></p>
    </div>

    <div class="save">
      <input id="rname" placeholder="Nombre de la ruta">
      <button id="save">Guardar</button>
      <button id="saveNew">Guardar como nueva</button>
    </div>
  </div>

  <div id="viewSaved" hidden>
    <header><h1>Rutas guardadas</h1><button id="back">Volver</button></header>
    <ul id="saved"></ul>
  </div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
